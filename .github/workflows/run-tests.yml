name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: [10.*, 11.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 11+ requires PHP 8.2+
          - php: '8.1'
            laravel: 11.*
          - php: '8.1'
            laravel: 12.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, simplexml
          coverage: none

      - name: Install dependencies
        run: |
          # Older Laravel patch releases carry advisories in subsystems this
          # package does not use; Composer 2.10+ blocks them during resolution.
          composer config --global policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-audit

      - name: Run tests
        run: vendor/bin/pest
